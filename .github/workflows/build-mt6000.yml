name: Build GL-MT6000 (main + bridge offload)

# GL-MT6000 sysupgrade image: OpenWrt main (pinned to 7eb9f10) + PR #24038 (L2 bridge offload).
# Run from the Actions tab. No secrets are used.
#
# dry_run = true : fetch sources, apply patches, fetch feeds, make defconfig, run pre-checks, then build host
#                  tools and run firewall4 + kernel "prepare" so every package/kernel patch is really applied.
#                  No compile of the toolchain or kernel. Do this first.
# dry_run = false: full build, then post-build checks, then uploads the image.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "rebased = bridge-offload mbox on main 7eb9f10; pr = PR #24038 head db25d82 (older base)"
        default: rebased
        type: choice
        options: [rebased, pr]
      dry_run:
        description: "Stop after config, pre-checks and patch validation (no full build)"
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write   # only used to publish run logs to the ci-logs branch
    steps:
      - name: Checkout this repo (diffconfig, patches, scripts)
        uses: actions/checkout@v4
        with:
          path: bundle

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget

      - name: Fetch OpenWrt and select the patch set
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git clone https://github.com/openwrt/openwrt openwrt
          cd openwrt
          if [ "${{ inputs.mode }}" = "pr" ]; then
            git fetch origin pull/24038/head
            git checkout -q db25d8281e688923ae3b8a893d3198f3d7b8737c
          else
            git checkout -q 7eb9f10a83324d8980e8088bb295fc28a96cd15b
            git am --3way ../bundle/bridge-offload-on-main-7eb9f10.mbox
          fi
          git log -1 --format='source commit: %H %s'

      - name: Feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Config
        working-directory: openwrt
        run: |
          cp ../bundle/mt6000.diffconfig .config
          make defconfig

      - name: Pre-build checks
        working-directory: openwrt
        run: bash ../bundle/check.sh pre "$PWD" | tee ../pre-check.log

      - name: Validate patches apply (host tools, firewall4, kernel)
        if: ${{ inputs.dry_run }}
        working-directory: openwrt
        run: |
          set -o pipefail
          make tools/install -j"$(nproc)" 2>&1 | tee ../tools-install.log | tail -n 5
          make package/network/config/firewall4/download package/network/config/firewall4/prepare V=s 2>&1 | tee ../fw4-prepare.log | tail -n 20
          make target/linux/download target/linux/prepare V=s 2>&1 | tee ../kernel-prepare.log | tail -n 30
          if grep -E 'Hunk #[0-9]+ FAILED|can.t find file to patch|Patch failed|saving rejects' ../fw4-prepare.log ../kernel-prepare.log; then
            echo "PATCH FAILURES - do not build"; exit 1
          fi
          echo "--- patches applied with fuzz/offset (informational):"
          grep -hE 'with fuzz|FUZZ' ../fw4-prepare.log ../kernel-prepare.log | sort | uniq -c | sort -rn | head -n 30 || true
          echo "Patch validation passed."

      - name: Download sources
        if: ${{ !inputs.dry_run }}
        working-directory: openwrt
        run: make download -j8

      - name: Build
        if: ${{ !inputs.dry_run }}
        working-directory: openwrt
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Post-build checks
        if: ${{ !inputs.dry_run }}
        working-directory: openwrt
        run: bash ../bundle/check.sh post "$PWD" | tee ../post-check.log

      - name: Collect output
        if: ${{ !inputs.dry_run }}
        working-directory: openwrt
        run: |
          mkdir -p ../out
          cp bin/targets/mediatek/filogic/*gl-mt6000*sysupgrade.bin ../out/
          cp bin/targets/mediatek/filogic/SHA256SUMS.mt6000 ../out/
          cp bin/targets/mediatek/filogic/*gl-mt6000*.manifest ../out/
          cp .config ../out/build.config
          cp ../pre-check.log ../post-check.log ../out/
          git log -1 --format='%H %s' > ../out/source-commit.txt

      - name: Upload image
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: gl-mt6000-main-bridge-offload
          path: out/

      - name: Upload dry-run report
        if: ${{ always() && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-report
          path: |
            pre-check.log
            tools-install.log
            fw4-prepare.log
            kernel-prepare.log
            openwrt/.config
          if-no-files-found: ignore

      - name: Publish logs to branch ci-logs
        if: ${{ always() }}
        run: |
          rm -rf /tmp/ci-logs && mkdir -p /tmp/ci-logs
          for f in pre-check.log tools-install.log fw4-prepare.log kernel-prepare.log post-check.log; do
            if [ -f "$f" ]; then tail -n 2000 "$f" > "/tmp/ci-logs/$f"; fi
          done
          if [ -d openwrt/logs ]; then
            (cd openwrt && find logs -type f -name '*.txt' | head -n 60 | while read -r f; do
              mkdir -p "/tmp/ci-logs/$(dirname "$f")"; tail -n 300 "$f" > "/tmp/ci-logs/$f"; done)
          fi
          echo "run ${{ github.run_id }} mode=${{ inputs.mode }} dry_run=${{ inputs.dry_run }}" > /tmp/ci-logs/RUN.txt
          cd /tmp/ci-logs
          git init -q -b ci-logs
          git config user.email ci@example.com
          git config user.name ci
          git add -A
          git commit -q -m "logs for run ${{ github.run_id }}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs:ci-logs
